search:
  beam_width: 6
  eval_budget: 240
  max_rounds: 10
  min_features: 4
  final_top_k: 4
  max_swap_attempts: 60
  lambda_drop: 0.25
  no_improve_patience: 999
  seed: 42
  surrogate: xgb
  min_test_windows: 5
  mlr_selection_seeds: 6
models:
  gp:
    sample_subdir: samples
    variants:
      gp_01:
      - matern52+linear
      - none
      gp_02:
      - matern52
      - none
      gp_03:
      - matern52+linear
      - mean
      gp_04:
      - matern52
      - mean
      gp_05:
      - matern52+linear
      - stats:24h
      gp_06:
      - matern52
      - stats:24h
      gp_07:
      - matern52+linear
      - stats:12h
      gp_08:
      - matern52
      - stats:12h
    split:
      fault_tolerant: false
      nan_tolerance: 0.0
    hyperparameters:
      kernel: null
      ard: true
      ard_min_samples_per_dim: 1.0
      input_standardize: true
      target_standardize: true
      use_uncertain_input_kernel: false
      early_stop_metric: val_rmse
      early_stop_alpha: 0.5
      lengthscale_min: 0.05
      lengthscale_max: 10.0
      noise_min: 1.0e-05
      noise_max: 1.0
      outputscale_prior:
        type: gamma
        shape: 2.0
        rate: 0.15
      noise_prior:
        type: gamma
        shape: 1.5
        rate: 0.5
      learning_rate: 0.01
      num_epochs: 250
      patience: 20
      max_train_size: 5000
      early_stop_min_epochs: 50
  xgb:
    sample_subdir: mc_replicates
    variants:
      xgb_01: none
      xgb_02: stats:24h
      xgb_03: stats:12h
      xgb_04: mean
    split:
      fault_tolerant: true
      nan_tolerance: 0.8
    hyperparameters:
      metric: rmse
      tree_method: hist
      objective: reg:squarederror
      n_estimators: 300
      max_depth: 7
      subsample: 0.2
      colsample_bytree: 0.8
      min_child_weight: 8
      gamma: 0
      reg_lambda: 1
      reg_alpha: 0
      learning_rate: 0.01
      n_jobs: 2
      early_stopping_rounds: 300
      train_loss_plateau_rounds: 10
      train_loss_min_relative_improvement: 0.01
      cv_tuning:
        enabled: true
        n_folds: 5
        n_trials: 250
        seed: 21
        parallel_jobs: 1
        metric: rmse_r2
        selection_rule: best
        search_method: optuna
        optuna_sampler: tpe
        random_start_trials: 30
        use_early_stopping: false
        early_stopping_rounds: null
        verbose: false
        min_r2: 0.0
        r2_penalty: 10.0
        no_improvement_trials: 100
        no_improvement_se: 1.0
        param_space:
          n_estimators:
            low: 10
            high: 300
            type: int
          max_depth:
            low: 2
            high: 9
            type: int
          min_child_weight:
            low: 1
            high: 20
            type: int
          gamma:
            low: 0.0
            high: 2.0
            type: float
          subsample:
            low: 0.5
            high: 0.9
            type: float
          colsample_bytree:
            low: 0.3
            high: 1.0
            type: float
          reg_lambda:
            low: 1e-3
            high: 10.0
            type: log
          reg_alpha:
            low: 1e-4
            high: 5.0
            type: log
          learning_rate:
            low: 0.003
            high: 0.2
            type: log
seeds:
  n_seeds: 6
  band_k: 4.0
lead_times:
  hours:
  - 0
  - 12
  - 24
  - 48
  - 96
  - 144
  - 168
  replicates: 6
